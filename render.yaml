services:
  # --------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # --------------------------------------------------------------------------
  - type: web
    name: nwcip-backend
    runtime: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nwcip-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 1440
      - key: EMBEDDING_MODEL_NAME
        value: all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: GBIF_API_URL
        value: https://api.gbif.org/v1
      - key: INATURALIST_API_URL
        value: https://api.inaturalist.org/v1
      - key: EBIRD_API_URL
        value: https://api.ebird.org/v2
      - key: IUCN_API_URL
        value: https://api.iucnredlist.org/api/v4
      - key: CHAT_LLM_PROVIDER
        value: extractive

  # --------------------------------------------------------------------------
  # 2. React Vite Frontend Static Site
  # --------------------------------------------------------------------------
  - type: web
    name: nwcip-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: nwcip-backend
          property: host
        # Render will populate this with https://nwcip-backend.onrender.com/api/v1 via frontend config or full URL

databases:
  # --------------------------------------------------------------------------
  # 3. Managed PostgreSQL Database (with PostGIS & pgvector)
  # --------------------------------------------------------------------------
  - name: nwcip-postgres
    region: oregon
    plan: starter
    databaseName: wildlife_db
    user: wildlife_user
    postgresMajorVersion: "16"
